plugins {
  id 'com.android.application'
}

android {
  namespace 'com.squareup.duktape.tests'
  compileSdk rootProject.ext.compileSdkVersion
  ndkVersion rootProject.ext.ndkVersion

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  defaultConfig {
    applicationId 'com.squareup.duktape.tests'
    minSdk 28
    targetSdk 36

    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }

  lint {
    abortOnError false
  }
}

dependencies {
  implementation project(':duktape')
  androidTestImplementation project(path: ':duktape')
  implementation 'com.squareup.okio:okio:3.6.0'

  androidTestImplementation 'androidx.test:runner:1.5.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'com.google.truth:truth:1.1.5'

  // Force tests to use the same version of annotations as our Duktape artifact.
  androidTestImplementation 'androidx.annotation:annotation:1.7.1'
}

// AndroidTestTask is no longer available in newer AGP versions
// Test logging configuration can be handled in build.gradle or test configuration
